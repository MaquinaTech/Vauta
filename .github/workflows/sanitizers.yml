#
# The test suite under the thread sanitizer and the address sanitizer, weekly and on demand, and on a pull request that changes
# this file, so a change to it runs before it is merged. Races and memory errors the normal run does not see: the code has many
# locks and `@unchecked Sendable` types that only these tools check. Not a required check; a failure is triaged by hand, and a
# finding that is not a bug in Vauta gets a suppression with its reason (TSAN_OPTIONS `suppressions=`), never a skipped test.
#
# The suites that run the integrated or the search model on the GPU are skipped: their work runs in MLX's C++ and Metal's own
# threads, which these sanitizers do not model, and they are the slowest suites under them. `SanitizerWorkflowTests` checks that
# GPU_SUITES names every suite marked `.gpuExclusive` and nothing that does not exist.
name: Sanitizers

on:
  schedule:
    - cron: "41 5 * * 2" # weekly, Tuesday 05:41 UTC
  workflow_dispatch:
  pull_request:
    paths: [".github/workflows/sanitizers.yml"]

permissions:
  contents: read

concurrency:
  group: sanitizers-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GPU_SUITES: "LanguageModelEngineTests|LanguageModelGenerationTests|LanguageModelIntegrationTests|LanguageModelSchedulingTests|LanguageModelWarmPrefixTests|LanguageModelWarmingEngineTests|SearchModelMLXTests"

jobs:
  sanitize:
    name: Test with the ${{ matrix.sanitizer }} sanitizer
    # Same image as CI; see ci.yml for the macos-26 alternative.
    runs-on: xcode-27
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        sanitizer: [thread, address]
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        env:
          # Report every race, not only the first: a run is read whole. (The address sanitizer stops at its first error.)
          TSAN_OPTIONS: halt_on_error=0:second_deadlock_stack=1
          ASAN_OPTIONS: detect_stack_use_after_return=1
        run: swift test -j 3 --sanitize=${{ matrix.sanitizer }} --skip "$GPU_SUITES"
