#
# CodeQL static analysis for the Swift sources. Results appear under Security > Code scanning once the
# repository is public (or has GitHub Advanced Security). Needs a macOS runner: Swift is compiled for analysis.
# Whether CodeQL's Swift extractor accepts the Xcode 27 toolchain is unverified until Actions are on: after the first run,
# check Security > Code scanning > Tools that Swift files were analysed (the maintainer's release checks). The build step uses
# the native build system without the manifest sandbox; if Swift is still not analysed, run this job on macos-26 with
# Xcode 26 selected. Swift 6.4's `swift build` defaults to the swiftbuild backend, whose compiles run
# in a separate build-service process that the extractor may not trace, and a run could then finish green with no Swift file
# analysed: the last step fails such a run.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # weekly, Monday 04:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (Swift)
    # Same image as CI; see ci.yml for the macos-26 alternative.
    runs-on: xcode-27
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read          # CodeQL reads workflow run metadata
      security-events: write # upload the results
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        id: init
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: swift
          build-mode: manual
          queries: security-and-quality

      - name: Build
        # The native build system keeps every compile in this process tree, where the extractor traces it, and
        # --disable-sandbox keeps SwiftPM from spawning sandbox-exec for the manifest, which the tracer cannot start
        # ("Bad CPU type in executable" on the first run).
        run: swift build --build-system native --disable-sandbox --arch arm64

      - name: Analyze
        id: analyze
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: "/language:swift"

      # A green run proves nothing if the extractor saw no Swift file. Count them two ways, from what the analysis kept: the
      # sources in the database's archive and the files the results report as extracted. Fail only when both are zero.
      - name: Check that Swift files were analysed
        env:
          CODEQL: ${{ steps.init.outputs.codeql-path }}
          SARIF_DIR: ${{ steps.analyze.outputs.sarif-output }}
        run: |
          set -euo pipefail
          python3 - <<'EOF'
          import glob, json, os, zipfile
          archived = 0
          for db in glob.glob(os.path.join(os.environ["RUNNER_TEMP"], "codeql_databases", "swift*")):
              zipped, folder = os.path.join(db, "src.zip"), os.path.join(db, "src")
              if os.path.isfile(zipped):
                  with zipfile.ZipFile(zipped) as z:
                      archived += sum(name.endswith(".swift") for name in z.namelist())
              elif os.path.isdir(folder):
                  archived += sum(f.endswith(".swift") for _, _, files in os.walk(folder) for f in files)
          extracted = 0
          for path in glob.glob(os.path.join(os.environ.get("SARIF_DIR") or "../results", "*.sarif")):
              with open(path, encoding="utf-8") as f:
                  for run in json.load(f).get("runs", []):
                      for invocation in run.get("invocations", []):
                          extracted += sum(n.get("descriptor", {}).get("id", "").endswith("successfully-extracted-files")
                                           for n in invocation.get("toolExecutionNotifications", []))
          print(f"Swift files in the database's source archive: {archived}; reported as extracted: {extracted}")
          if archived == 0 and extracted == 0:
              print("::error::CodeQL analysed no Swift file, so this run checked nothing (see the top of codeql.yml)")
              raise SystemExit(1)
          EOF
          if [[ -n "${CODEQL:-}" ]]; then "$CODEQL" database print-baseline "$RUNNER_TEMP/codeql_databases/swift" || true; fi
