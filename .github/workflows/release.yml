#
# Source-only release. Vauta is distributed as source code: users clone the repository and build it on their own
# Mac (README, "Install from source"). This workflow checks that a tag is releasable (valid tag, on main, tests
# pass, the app builds) and creates a DRAFT GitHub release whose notes are the matching section of CHANGELOG.md.
# It uploads no binaries and uses no secrets, certificates or notarization. The app is built ad hoc, only to prove that
# it builds. A maintainer reviews and publishes the draft by hand. Steps: docs/RELEASING.md.
name: Release

# Manual only, and run ON the tag: `gh workflow run release.yml --ref v0.9.0` (or choose the tag in the "Use workflow from"
# menu of the Actions tab).
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  check:
    name: Check the tag
    # Same image as CI; see ci.yml for the macos-26 alternative.
    runs-on: xcode-27
    timeout-minutes: 60
    # Read only: the tests and the build run here. Only the job below, which runs no code from the repository, can write.
    permissions:
      contents: read
    env:
      TAG: ${{ github.ref_name }}
    outputs:
      version: ${{ steps.notes.outputs.version }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      - name: Validate the tag
        env:
          REF_TYPE: ${{ github.ref_type }}
        run: |
          [[ "$REF_TYPE" == "tag" ]] || { echo "::error::run this workflow on a tag (gh workflow run release.yml --ref v1.2.3), not on a branch"; exit 1; }
          [[ "$TAG" =~ ^v([0-9]+(\.[0-9]+){0,2})$ ]] || { echo "::error::tag must look like v1.2.3, got '$TAG'"; exit 1; }
          echo "VAUTA_VERSION=${BASH_REMATCH[1]}" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history: CFBundleVersion is the commit count
          persist-credentials: false

      - name: Check the tag is on main
        run: |
          # The checkout above (fetch-depth: 0) already fetched every branch, so origin/main exists; no second fetch
          # (it would run without credentials and fail while the repository is private).
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null \
            || { echo "::error::origin/main was not fetched"; exit 1; }
          git merge-base --is-ancestor HEAD origin/main \
            || { echo "::error::$TAG is not an ancestor of main: release only commits that went through review and CI"; exit 1; }

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Test
        run: swift test

      - name: Build the app (ad hoc, only to prove it builds)
        env:
          VAUTA_ALLOW_ADHOC: "1"
        run: scripts/build-app.sh

      - name: Take the release notes from CHANGELOG.md
        id: notes
        run: |
          # The section "## [<version>]" up to the next "## [" heading.
          awk -v v="$VAUTA_VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" v "]") == 1) { found = 1; next } }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [[ -s "$RUNNER_TEMP/notes.md" ]] \
            || { echo "::error::CHANGELOG.md has no section '## [$VAUTA_VERSION]'"; exit 1; }
          printf '\nVauta is distributed as source code only. Build it from this tag: see "Install from source" in the README.\n' >> "$RUNNER_TEMP/notes.md"
          delimiter="notes-$(uuidgen)"
          {
            echo "version=$VAUTA_VERSION"
            echo "notes<<$delimiter"
            cat "$RUNNER_TEMP/notes.md"
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"

  draft:
    name: Draft the release
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write      # create the draft release
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VAUTA_VERSION: ${{ needs.check.outputs.version }}
          NOTES: ${{ needs.check.outputs.notes }}
        run: |
          printf '%s\n' "$NOTES" > "$RUNNER_TEMP/notes.md"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "Vauta $VAUTA_VERSION" --notes-file "$RUNNER_TEMP/notes.md"
