#
# OpenSSF Scorecard: checks the repository's security practices (pinned actions, branch protection, signed
# releases, …). It publishes the score to the OpenSSF API only when the repository is public, which is what the
# badge and api.securityscorecards.dev need. Results also go to Security > Code scanning.
name: Scorecard

on:
  branch_protection_rule:
  push:
    branches: [main]
  schedule:
    - cron: "41 3 * * 2" # weekly, Tuesday 03:41 UTC
  workflow_dispatch:

# Read-only at the top; the job asks for what it needs.
permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest # the Scorecard action is a container action: Linux only
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      security-events: write # upload SARIF to code scanning
      id-token: write        # publish results to the OpenSSF API (required for publish_results)
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # This workflow runs only once the repository is public (Actions stay off until then),
          # which is what publishing needs, as in the official template.
          publish_results: true

      - name: Keep the results with the run
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
