name: Feature request
description: Suggest an improvement or a new capability.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Vauta stays local-first: no cloud services, no telemetry and no third-party dependencies.
        Ideas that fit within that are very welcome.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation and why the current behavior falls short.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This works without sending meeting data anywhere except the user's own model server.
          required: true
